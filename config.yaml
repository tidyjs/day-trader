# All thresholds are assumptions to be tested (SPEC section 3). Do not tune
# them off a handful of trades (SPEC 4.4a): changes wait for the phase 1 review.

timezone: America/New_York

account:
  equity_usd: 50
  risk_per_trade: 0.05
  daily_loss_cap: 0.10
  max_consecutive_losses: 2
  max_open_positions: 1
  max_shortlist: 5

schedule:
  premarket_start: "04:00"
  scan_time: "09:15"          # ET; email goes out at this time
  sip_delay_minutes: 16       # free plan refuses SIP newer than 15 min

universe:
  exchanges: [NYSE, NASDAQ, AMEX, ARCA, BATS]
  # Alpaca has no clean "common stock" flag. Names containing these words are
  # dropped unless they also say "common" or "ordinary".
  exclude_name_words: [warrant, unit, " right", etf, etn, fund, trust, preferred, "depositary share", notes]

scan:
  price_min: 1.00
  price_max: 2.00
  gap_min_pct: 10.0
  # Prior closes below this are not fetched. 0.25 allows a gap of up to +300%
  # into $1.00. The upper bound is exact: price_max / (1 + gap_min).
  prior_close_floor: 0.25

filters:                      # SPEC 4.1 must-pass rules
  min_pm_dollar_volume: 100000
  min_pm_trades: 50           # fake-print guard (SPEC 5 caveat)
  continuation:
    sessions: 3               # look at the last 3 sessions
    close_up_pct: 20          # ...for a close up >= 20%
    volume_multiple: 3        # ...or volume >= 3x the average
    avg_volume_sessions: 20   # average over the 20 sessions before that window
    min_avg_sessions: 5       # fewer than this -> volume part unknown
    history_calendar_days: 45
  prior_range_top_pct: 25     # prior close in the top 25% of its range
  float_max: 50000000
  float_margin_pct: 15        # never hard-fail within 15% over the cap

warnings:                     # SPEC 4.3
  spread_warn_pct: 3
  spread_window_minutes: 2    # quotes in the last N minutes before the data cutoff
  spread_max_quotes: 200
  shares_stale_days: 120
  shares_mismatch_pct: 25

edgar:
  offering_lookback_days: 5
  reverse_split_lookback_days: 60
  deficiency_lookback_days: 90
  max_docs_per_name: 8
  doc_max_bytes: 1500000
  cover_chars: 5000
  excerpt_chars: 300

catalyst:                     # SPEC 6; the LLM output is one input, never a selector
  model: claude-haiku-5-5
  effort: low
  max_tokens: 4000
  news_lookback_hours: 48
  max_symbols_per_item: 3     # more tags than this = a "stocks moving" roundup, dropped
  max_items: 20
  summary_chars: 600
  # "no verifiable catalyst AND no prior-day volume surge" disqualifies (4.2);
  # the surge uses filters.continuation volume_multiple / avg_volume_sessions.

halts:
  # Markets whose halts the Nasdaq Trader feed is confirmed to carry. A name listed
  # anywhere else gets "halt status unknown", never a clean pass. NYSE, ARCA and
  # BATS stay out until a scan's feed shows them (see data/halts_markets.csv).
  confirmed_markets: [NASDAQ, AMEX]

t212:
  base_url_env: T212_BASE_URL
  default_base_url: https://live.trading212.com
  max_age_days: 1             # older lists get the "T212 list is N days old" warning

paths:
  cache: data/cache           # git-ignored (EDGAR ticker map)
  scans: data/scans
  candidates: data/candidates.csv
  t212: data/t212
