name: morning-scan

# Cron is UTC with no DST. 13:15 = 09:15 EDT, 14:15 = 09:15 EST, 15:30 = backstop
# (10:30 EST / 11:30 EDT) that alerts if no scan exists. src/run.py checks New
# York time and exits quietly on the entry that doesn't apply (SPEC 9).
on:
  schedule:
    - cron: "15 13 * * 1-5"
    - cron: "15 14 * * 1-5"
    - cron: "30 15 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = time-gated morning scan; test_message = write one test message; past_day = re-run the last completed trading day"
        type: choice
        options: [normal, test_message, past_day]
        default: normal

# One scan at a time: a delayed off-season run waits, then sees today's scan and exits.
concurrency:
  group: morning-scan
  cancel-in-progress: false

permissions:
  contents: write   # commit data/ and messages/ back to the repo
  issues: write     # open a GitHub Issue for each new message (built-in token, no secrets)

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.12"
      - run: pip install -r requirements.txt
      - name: Scan (gated on New York time)
        id: scan
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
          T212_BASE_URL: ${{ secrets.T212_BASE_URL }}
          MODE: ${{ inputs.mode }}   # empty on scheduled runs -> normal
        run: |
          git pull --ff-only   # see a scan or alert committed by an earlier run
          python -m src.run --mode "${MODE:-normal}"
      - name: Commit data and messages back (also after a failure, so the alert is kept)
        if: always()
        run: |
          python -m src.github_issues list > "$RUNNER_TEMP/new_messages.txt"   # before committing
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          # Add only folders that exist: a quiet "skip" run writes no messages,
          # and git exits 128 on a path that doesn't exist.
          for d in data messages; do
            if [ -e "$d" ]; then git add -- "$d"; fi
          done
          git diff --cached --quiet || git commit -m "data: scan $(TZ=America/New_York date +%F)"
          git pull --rebase && git push
      - name: Open a GitHub Issue for each new message
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_USER: ${{ vars.NOTIFY_USER }}   # optional repo variable: your GitHub username, for an @mention
        run: python -m src.github_issues open --list "$RUNNER_TEMP/new_messages.txt"
